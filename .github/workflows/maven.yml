name: Maven CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_database_secret
          MYSQL_DATABASE: commercial_complex_carbon_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_database_secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: commercial_complex_carbon_ci
      DB_USER: root
      DB_PASSWORD: ci_database_secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Prepare Maven wrapper
        run: chmod +x mvnw
      - name: Initialize test database
        env:
          MYSQL_PWD: ci_database_secret
        run: |
          mysql -h 127.0.0.1 -uroot commercial_complex_carbon_ci < database/cloud/railway_init.sql
          mysql -h 127.0.0.1 -uroot commercial_complex_carbon_ci -e "UPDATE app_user SET username='admin',user_status=1 WHERE user_id=1"
      - name: Run tests
        run: ./mvnw test
      - name: Package WAR
        run: ./mvnw clean package
